<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLOI - Website đang được bảo trì</title>
  
  <link rel="icon" href="resources/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="resources/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="resources/icons/favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="32x32" href="resources/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="resources/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="resources/icons/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-color: #ffffff;
      --text-title: #1f1f1f;
      --text-body: #444444;
      --pink-primary: #eb7b9b;
      --pink-dark: #d44e74;
      --pink-light: #fff0f3;
      --pink-border: #f7cbd6;

      --accent: #f1707b;
      --coral: #f5968a;
      --yellow: #f6be3c;
      --dark: #231f20;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-body);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
      position: relative;
    }

    .lang-switcher {
      position: fixed;
      top: 20px;
      right: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      z-index: 10;
    }

    .lang-glider {
      position: absolute;
      top: 0;
      left: 0;
      background-color: var(--pink-light);
      border-radius: 6px;
      z-index: 0;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.34, 1.35, 0.64, 1),
                  width 0.28s cubic-bezier(0.34, 1.35, 0.64, 1),
                  height 0.28s cubic-bezier(0.34, 1.35, 0.64, 1),
                  opacity 0.2s ease;
      will-change: transform, width, height;
      opacity: 0;
    }

    .lang-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      color: #888888;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 6px;
      transition: color 0.2s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    .lang-btn:hover {
      color: var(--pink-dark);
    }

    .lang-btn:active {
      transform: scale(0.93);
    }

    .lang-btn.active {
      color: var(--pink-dark);
      font-weight: 700;
    }

    @keyframes btnPop {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .lang-btn.pop {
      animation: btnPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lang-divider {
      position: relative;
      z-index: 1;
      color: #e5e5e5;
      user-select: none;
    }

    .maintenance-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 580px;
      width: 100%;
      margin: auto;
    }

    .mascot-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 26px;
    }

    .mascot-dragon {
      width: 220px;
      height: 220px;
      user-select: none;
    }

    .text-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: opacity 0.22s cubic-bezier(0.25, 1, 0.5, 1), transform 0.22s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }

    .text-content.is-fading {
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 0.12s ease-in, transform 0.12s ease-in;
    }

    h1 {
      font-size: clamp(22px, 3.2vw, 26px);
      font-weight: 600;
      color: var(--text-title);
      line-height: 1.35;
      letter-spacing: -0.01em;
      margin-bottom: 12px;
    }

    .message {
      font-size: clamp(14px, 2vw, 15px);
      font-weight: 400;
      color: var(--text-body);
      line-height: 1.65;
      max-width: 520px;
      margin-bottom: 32px;
      min-height: 3.3em;
    }

    .status-link {
      color: var(--pink-dark);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .status-link:hover {
      color: #b5385c;
    }

    .brand-logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 4px;
    }

    .brand-logo {
      width: 230px;
      height: auto;
      object-fit: contain;
      user-select: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .text-content {
        transition: none !important;
        transform: none !important;
      }
      .lang-btn,
      .lang-glider {
        transition: none !important;
        animation: none !important;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 48px 16px 24px;
      }

      .lang-switcher {
        top: 14px;
        right: 16px;
      }

      .mascot-dragon {
        width: 170px;
        height: 170px;
      }

      .brand-logo {
        width: 190px;
      }
    }
  </style>
</head>
<body>
  <div class="lang-switcher">
    <span class="lang-glider" id="lang-glider" aria-hidden="true"></span>
    <button type="button" class="lang-btn active" id="btn-vi" onclick="setLanguage('vi')">Tiếng Việt</button>
    <span class="lang-divider">|</span>
    <button type="button" class="lang-btn" id="btn-en" onclick="setLanguage('en')">English</button>
  </div>

    <div class="text-content" id="text-content">
      <h1 id="title">Website đang được bảo trì</h1>
      <p class="message" id="message">
        Website sẽ sớm hoạt động trở lại. Kiểm tra <a href="https://link.tloi.vn/status" class="status-link" target="_blank" rel="noopener noreferrer">link.tloi.vn/status</a> để cập nhật thông tin.
      </p>
    </div>

    <div class="brand-logo-container">
      <img src="resources/icons/tloi.png" alt="TLOI" class="brand-logo">
    </div>
  </main>

  <script>
    const translations = {
      vi: {
        pageTitle: "TLOI - Website đang được bảo trì",
        title: "Website đang được bảo trì",
        messageHtml: 'Website sẽ sớm hoạt động trở lại. Kiểm tra <a href="https://link.tloi.vn/status" class="status-link" target="_blank" rel="noopener noreferrer">link.tloi.vn/status</a> để cập nhật thông tin.'
      },
      en: {
        pageTitle: "TLOI - Website Under Maintenance",
        title: "Sorry, we're down for maintenance",
        messageHtml: 'We\'ll be back up shortly. Check <a href="https://link.tloi.vn/status" class="status-link" target="_blank" rel="noopener noreferrer">link.tloi.vn/status</a> for updates.'
      }
    };

    let isSwitching = false;

    function updateGlider(btn, animate = true) {
      const glider = document.getElementById('lang-glider');
      if (!glider || !btn) return;

      const isReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!animate || isReduced) {
        const prevTransition = glider.style.transition;
        glider.style.transition = 'none';
        glider.style.width = `${btn.offsetWidth}px`;
        glider.style.height = `${btn.offsetHeight}px`;
        glider.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
        glider.style.opacity = '1';
        void glider.offsetHeight;
        glider.style.transition = prevTransition;
        return;
      }

      glider.style.width = `${btn.offsetWidth}px`;
      glider.style.height = `${btn.offsetHeight}px`;
      glider.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
      glider.style.opacity = '1';
    }

    function setLanguage(lang, animate = true) {
      const selected = translations[lang] ? lang : 'vi';
      const activeBtn = document.getElementById('btn-' + selected);

      document.getElementById('btn-vi').classList.toggle('active', selected === 'vi');
      document.getElementById('btn-en').classList.toggle('active', selected === 'en');
      updateGlider(activeBtn, animate);

      if (animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        activeBtn.classList.remove('pop');
        void activeBtn.offsetWidth;
        activeBtn.classList.add('pop');
        setTimeout(() => activeBtn.classList.remove('pop'), 280);
      }

      if (document.documentElement.lang === selected && animate) return;

      const content = translations[selected];
      const textContainer = document.getElementById('text-content');

      try {
        localStorage.setItem('tloi_lang', selected);
      } catch (e) {}

      if (!animate || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.lang = selected;
        document.title = content.pageTitle;
        document.getElementById('title').textContent = content.title;
        document.getElementById('message').innerHTML = content.messageHtml;
        return;
      }

      if (isSwitching) return;
      isSwitching = true;

      textContainer.classList.add('is-fading');
      setTimeout(() => {
        document.documentElement.lang = selected;
        document.title = content.pageTitle;
        document.getElementById('title').textContent = content.title;
        document.getElementById('message').innerHTML = content.messageHtml;
        textContainer.classList.remove('is-fading');
        setTimeout(() => {
          isSwitching = false;
        }, 220);
      }, 120);
    }

    function initLanguage() {
      const urlParam = new URLSearchParams(window.location.search).get('lang');
      let targetLang = 'vi';
      if (urlParam && (urlParam === 'vi' || urlParam === 'en')) {
        targetLang = urlParam;
      } else {
        try {
          const savedLang = localStorage.getItem('tloi_lang');
          if (savedLang && (savedLang === 'vi' || savedLang === 'en')) {
            targetLang = savedLang;
          }
        } catch (e) {}
      }

      setLanguage(targetLang, false);

      const activeBtn = document.getElementById('btn-' + targetLang);
      updateGlider(activeBtn, false);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          const currentActive = document.querySelector('.lang-btn.active');
          if (currentActive) updateGlider(currentActive, false);
        });
      }
    }

    window.addEventListener('resize', () => {
      const currentActive = document.querySelector('.lang-btn.active');
      if (currentActive) updateGlider(currentActive, false);
    });

    initLanguage();
  </script>
</body>
</html>
